# lefthook.yml
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    ruff-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    djlint-format:
      glob: "*.html"
      run: uv run djlint {staged_files} --reformat
      stage_fixed: true


pre-push:
  commands:
    pytest:
      tags: backend test
      run: uv run pytest

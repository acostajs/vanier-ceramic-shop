[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudinary>=1.44.2",
    "dj-database-url[postgres]>=3.1.0",
    "django>=5.2.8",
    "django-cloudinary-storage>=0.3.0",
    "faker>=25.8.0",
    "gunicorn>=23.0.0",
    "pillow>=12.0.0",
    "playwright>=1.48.0",
    "psycopg2-binary>=2.9.11",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-playwright>=0.6.0",
    "python-dotenv>=1.2.1",
    "stripe>=14.0.1",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "djlint>=1.39.0",
    "ruff>=0.14.7",
]
[tool.ruff]
lint.extend-per-file-ignores = { "main/settings/**.py" = ["F403", "F405"] }

[tool.djlint]
profile = "django"
indent = 2
exclude = ".venv,venv,staticfiles,mediafiles"

